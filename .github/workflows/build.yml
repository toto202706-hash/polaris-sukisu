name: build-polaris-ksu
on:
  workflow_dispatch:
env:
  SRC_URL: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  SRC_BRANCH: polaris-o-oss
  DEFCONFIG: polaris_user_defconfig
  KSU_BRANCH: builtin
  OUT_NAME: boot_sukisu
  WITH_KPM: "0"
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev zip unzip git curl python3 cpio rsync device-tree-compiler gcc-aarch64-linux-gnu
      - name: Fetch prebuilt clang
        run: |
          set -x
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b tc/clang -q \
            || git clone --depth 1 https://github.com/Jacksonzwang/android_prebuilts_clang_kernel_linux-x86_clang-r383902 tc/clang -q
          tc/clang/bin/clang --version
      - name: Clone kernel source
        run: |
          git clone --depth 1 -b $SRC_BRANCH $SRC_URL ksrc
          cd ksrc && git log --oneline -1
      - name: Integrate SukiSU driver
        run: |
          set -e
          cd ksrc
          git clone --depth 1 -b $KSU_BRANCH https://github.com/SukiSU-Nova/SukiSU-Nova KernelSU -q
          cd drivers
          ln -sfn ../KernelSU/kernel kernelsu
          grep -q 'CONFIG_KSU' Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> Makefile
          grep -q 'drivers/kernelsu/Kconfig' Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' Kconfig
          cd $GITHUB_WORKSPACE/ksrc
          python3 $GITHUB_WORKSPACE/scripts/patch_ksu49.py .
          echo INTEGRATION_DONE
      - name: Configure
        run: |
          set -e
          cd ksrc
          export PATH=$GITHUB_WORKSPACE/tc/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="clang --target=aarch64-linux-gnu -integrated-as"
          make O=out ARCH=arm64 CC="$CC" $DEFCONFIG
          ARGS=""
          if [ "$WITH_KPM" = "1" ]; then ARGS="-e KPM -e KALLSYMS -e KALLSYMS_ALL"; fi
          ./scripts/config --file out/.config -e KSU -e KPROBES -e TMPFS_XATTR -e OVERLAY_FS -e SECURITY_SELINUX -d KSU_DEBUG $ARGS
          make O=out ARCH=arm64 CC="$CC" olddefconfig
          grep -E 'CONFIG_KSU|CONFIG_KPM|CONFIG_KPROBES|CONFIG_TMPFS_XATTR|CONFIG_OVERLAY_FS|CONFIG_SECURITY_SELINUX=' out/.config
      - name: Build kernel
        run: |
          set -o pipefail
          cd ksrc
          export PATH=$GITHUB_WORKSPACE/tc/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="clang --target=aarch64-linux-gnu -integrated-as"
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          export HOSTCC=gcc
          export HOSTCXX=g++
          export HOSTCFLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -std=gnu89 -fcommon"
          make -j$(nproc) O=out ARCH=arm64 CC="$CC" Image.gz-dtb 2>&1 | tee ../build.log | tail -150
          ls -la out/arch/arm64/boot/
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
      - name: Repack boot.img
        if: success()
        run: |
          set -e
          cp ksrc/out/arch/arm64/boot/Image.gz-dtb Image.gz-dtb
          ls -la Image.gz-dtb
          curl -fL -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v31.1/Magisk-v31.1.apk
          mkdir -p mbt && unzip -o -j magisk.apk 'lib/x86_64/libmagiskboot.so' -d mbt
          chmod +x mbt/libmagiskboot.so
          mkdir -p work && cd work
          ../mbt/libmagiskboot.so unpack ../boot_stock.img
          ls -la
          cp ../Image.gz-dtb kernel
          ../mbt/libmagiskboot.so repack ../boot_stock.img ../$OUT_NAME.img
          ls -la ../$OUT_NAME.img
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: boot-artifact
          path: boot_sukisu.img
          if-no-files-found: error
